[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-optical-table-parser"
version = "0.1.0"
description = "Spatial-layout table extractor transforming complex multi-span and borderless PDF tables into pristine Markdown/CSV structures"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-optical-table-parser = "agent_optical_table_parser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_optical_table_parser*"]
